name: Ping Test

on:
  workflow_dispatch:

jobs:
  ping_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run ping
        run: |
          set -euxo pipefail
          echo "Ping Cloudflare:"
          ping -c 4 1.1.1.1 || true
          echo "DNS resolve + HTTPS check:"
          getent hosts example.com
          curl -I https://example.com
          
